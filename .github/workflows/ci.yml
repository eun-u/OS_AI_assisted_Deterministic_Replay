name: ADR CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build sqlite3

      - name: Run full validation
        run: ./scripts/full_validation.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adr-reports
          path: reports/
